<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order editing demo — ClickPost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  * { box-sizing: border-box; }
  body { font-family: Poppins, sans-serif; color: #252525; }
  a { color: #155FFF; text-decoration: none; }
  a:hover { color: #0A3FCC; }

  .cp-head { height: 88px; display: flex; flex-direction: row; padding: 30px 112px;
             justify-content: space-between; align-items: center;
             background: rgba(255,255,255,0.95); backdrop-filter: blur(6px);
             box-shadow: 0 0 20px rgba(16,24,40,0.1); position: sticky; top: 0; z-index: 50; }
  .cp-back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #52525B; }
  .cp-back:hover { color: #155FFF; }

  .cp-wrap { padding: 72px 112px 96px; display: flex; flex-direction: row;
             gap: 48px; align-items: center; }
  .cp-col { width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
            gap: 20px; align-items: flex-start; }
  .cp-col h1 { margin: 0; font-size: 44px; font-weight: 500; line-height: 54px;
               letter-spacing: -0.01em; color: #252525; }
  .cp-col p { margin: 0; font-size: 15px; font-weight: 500; line-height: 22px; color: #252525; }
  .cp-hint { font-size: 13px; line-height: 20px; color: #6A7282; }
  .cp-egs { display: flex; flex-direction: row; gap: 8px; flex-wrap: wrap; }
  .cp-eg { padding: 6px 12px; border-radius: 9999px; border: 1px solid #E5E7EB;
           background: #ffffff; font-family: Poppins, sans-serif; font-size: 13px;
           color: #52525B; cursor: pointer;
           transition: border-color 140ms ease-out, color 140ms ease-out; }
  .cp-eg:hover { border-color: #155FFF; color: #155FFF; }

  /* store-URL field */
  .cp-spin__form { display: flex; flex-direction: row; align-items: center; gap: 6px;
                   width: 100%; max-width: 420px; padding: 5px; border-radius: 9999px;
                   background: #ffffff; border: 1px solid #D6E4FF;
                   box-shadow: 0 10px 40px -14px rgba(15,15,25,0.16);
                   transition: border-color 160ms ease-out, box-shadow 160ms ease-out; }
  .cp-spin__form:focus-within { border-color: #155FFF;
                                box-shadow: 0 14px 50px -14px rgba(21,95,255,0.3); }
  .cp-spin__input { flex: 1; height: 44px; padding: 0 6px 0 18px; border: none; outline: none;
                    background: transparent; font-family: Poppins, sans-serif; font-size: 15px;
                    color: #252525; min-width: 0; }
  .cp-spin__input::placeholder { color: #A7A7AB; }
  .cp-spin__go { display: inline-flex; align-items: center; justify-content: center;
                 width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 9999px;
                 cursor: pointer; background: #155FFF; color: #ffffff;
                 transition: background 160ms ease-out, transform 160ms ease-out; }
  .cp-spin__go:hover { background: #0A3FCC; }
  .cp-spin__go:active { transform: scale(0.94); }

  /* browser-chrome frame around the embedded demo */
  .cp-spin__stage { position: relative; width: 648px; flex-shrink: 0; height: 720px;
                    border-radius: 12px; overflow: hidden; background: #ffffff;
                    box-shadow: 0 24px 60px rgba(10,22,40,0.22); }
  .cp-spin__chrome { display: flex; flex-direction: row; align-items: center; gap: 8px;
                     height: 44px; padding: 0 16px; background: #ffffff;
                     border-bottom: 1px solid #F1F1F1; }
  .cp-spin__dot { width: 10px; height: 10px; border-radius: 9999px; background: #D3D3D3; flex-shrink: 0; }
  .cp-spin__bar { flex: 1; max-width: 360px; margin: 0 auto; height: 26px; border-radius: 9999px;
                  background: #F6F6F6; display: flex; align-items: center; justify-content: center;
                  font-size: 12px; color: #929292; }
  .cp-spin__frame { width: 100%; height: calc(100% - 44px); border: 0; display: block; background: #ffffff; }
  .cp-spin__empty { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; display: flex;
                    flex-direction: column; gap: 8px; justify-content: center; align-items: center;
                    background: #F6F6F6; text-align: center; padding: 0 40px; }
  .cp-spin__stage[data-demo-open="1"] .cp-spin__empty { display: none; }
  .cp-spin__stage[data-demo-open="0"] .cp-spin__frame { visibility: hidden; }
</style>
</head>
<body>

  <header class="cp-head">
    <a href="index.html"><img src="assets/wordmark-blue.svg" alt="ClickPost" style="width: 130px; height: 18px; display: block;"></a>
    <a class="cp-back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      Back to order editing
    </a>
  </header>

  <div class="cp-wrap">
    <div class="cp-col">
      <h1>See it running on your own store</h1>
      <p>Paste a store URL — we’ll pull in your real products</p>
      <div class="cp-spin__form">
        <input id="cp-demo-url" class="cp-spin__input" type="text" inputmode="url" spellcheck="false"
               placeholder="yourstore.com" aria-label="Your store URL">
        <button id="cp-demo-go" type="button" class="cp-spin__go" aria-label="Load the demo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
      <span class="cp-hint">Products and prices are pulled live from the store you enter.</span>
      <div class="cp-egs">
        <button class="cp-eg" type="button" data-store="marsghc.com">marsghc.com</button>
        <button class="cp-eg" type="button" data-store="gullylabs.com">gullylabs.com</button>
      </div>
    </div>

    <div id="cp-stage" class="cp-spin__stage" data-demo-open="0">
      <div class="cp-spin__chrome">
        <span class="cp-spin__dot"></span><span class="cp-spin__dot"></span><span class="cp-spin__dot"></span>
        <span id="cp-demo-label" class="cp-spin__bar">yourstore.com</span>
      </div>
      <div class="cp-spin__empty">
        <span style="font-size: 18px; font-weight: 500; color: #252525;">Your products, inside the editor</span>
        <span style="font-size: 15px; color: #52525B;">Add a store above, or pick one of the examples.</span>
      </div>
      <iframe id="cp-demo-frame" class="cp-spin__frame" src="about:blank" title="Order editing demo"
              referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

<script>
  // Same origin rule as the landing page: a local override wins, localhost
  // points at a dev server, everything else at the deployed demo app.
  function demoOrigin() {
    if (window.__CP_DEMO_ORIGIN__) return window.__CP_DEMO_ORIGIN__;
    var h = window.location.hostname;
    if (h === "localhost" || h === "127.0.0.1") return "http://127.0.0.1:3001";
    return "https://oe-demo-fullbleed.vercel.app";
  }

  function slugForStore(v) {
    var s = String(v || "").trim().toLowerCase();
    if (!s) return "";
    s = s.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/[\/?#].*$/, "");
    return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(s) ? s : "";
  }

  var input = document.getElementById("cp-demo-url");
  var stage = document.getElementById("cp-stage");
  var frame = document.getElementById("cp-demo-frame");
  var label = document.getElementById("cp-demo-label");

  function open(store) {
    var slug = slugForStore(store);
    if (!slug) { input.focus(); return; }
    input.value = slug;
    label.textContent = slug;
    frame.src = demoOrigin() + "/product-demo/" + encodeURIComponent(slug);
    stage.setAttribute("data-demo-open", "1");
  }

  document.getElementById("cp-demo-go").addEventListener("click", function () { open(input.value); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); open(input.value); } });
  Array.prototype.forEach.call(document.querySelectorAll(".cp-eg"), function (b) {
    b.addEventListener("click", function () { open(b.getAttribute("data-store")); });
  });

  // ?store=example.com opens straight into that store
  var q = new URLSearchParams(window.location.search).get("store");
  open(q || "marsghc.com");   // land on a real store so the frame is never empty
</script>
</body>
</html>
