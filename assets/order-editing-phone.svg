<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 880" width="620" height="880" fill="none" role="img" aria-labelledby="oePhoneTitle oePhoneDesc">
  <title id="oePhoneTitle">The order-editing screen a shopper sees</title>
  <desc id="oePhoneDesc">A phone showing a thank-you page with an edit window counting down and self-serve actions: add products, edit shipping address, change variant or quantity, apply discounts, cancel order — plus an upsell offer.</desc>

  <defs>
    <style>
      .f  { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .b  { font-weight: 700; }
      .sb { font-weight: 600; }
      .eb { font-weight: 800; }
      .ink { fill: #252525; }
      .mut { fill: #52525B; }
      .blu { fill: #155FFF; }
    </style>

    <filter id="pShadow" x="-40%" y="-25%" width="180%" height="155%">
      <feDropShadow dx="-6" dy="28" stdDeviation="30" flood-color="#0A1628" flood-opacity="0.28"/>
    </filter>
    <filter id="pSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#263238" flood-opacity="0.10"/>
    </filter>

    <!-- brushed-metal frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#8E9AA8"/>
      <stop offset="8%"   stop-color="#F2F5F9"/>
      <stop offset="20%"  stop-color="#5C6674"/>
      <stop offset="50%"  stop-color="#39424F"/>
      <stop offset="80%"  stop-color="#5C6674"/>
      <stop offset="93%"  stop-color="#EDF1F6"/>
      <stop offset="100%" stop-color="#7C8794"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="bgSwirlA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6E4FF"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="upsell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FC"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="tote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE9DC"/>
      <stop offset="100%" stop-color="#DED5C3"/>
    </linearGradient>

    <clipPath id="clipScreen"><rect x="132" y="52" width="356" height="756" rx="42"/></clipPath>
    <clipPath id="clipTote"><rect x="160" y="606" width="122" height="128" rx="8"/></clipPath>
  </defs>

  <!-- ============ abstract backdrop ============ -->
  <g>
    <ellipse cx="520" cy="250" rx="230" ry="170" fill="url(#bgSwirlA)" transform="rotate(-26 520 250)"/>
    <ellipse cx="120" cy="690" rx="210" ry="150" fill="url(#bgSwirlA)" transform="rotate(16 120 690)"/>
    <g stroke="#B9D0FF" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M470 40c126 96 150 250 62 372s-96 236 22 344" stroke-width="18"/>
      <path d="M556 92c108 110 112 252 20 366s-70 214 46 306" stroke-width="14" opacity=".7"/>
      <path d="M96 250c-70 118-46 250 56 330s130 176 84 268" stroke-width="16" opacity=".55"/>
    </g>
    <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M512 66c118 100 136 246 52 362s-88 226 28 330" stroke-width="7"/>
      <path d="M64 292c-58 112-30 232 66 306" stroke-width="6" opacity=".8"/>
    </g>
  </g>

  <!-- ============ the phone, tilted ============ -->
  <g transform="rotate(-6 310 440)">
    <!-- frame -->
    <g filter="url(#pShadow)">
      <rect x="112" y="32" width="396" height="796" rx="62" fill="url(#frame)"/>
    </g>
    <rect x="122" y="42" width="376" height="776" rx="54" fill="#12181F"/>
    <rect x="132" y="52" width="356" height="756" rx="42" fill="#ffffff"/>

    <!-- side buttons -->
    <rect x="506" y="250" width="5" height="86" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="220" width="5" height="46" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="286" width="5" height="76" rx="2.5" fill="#6B7683"/>

    <!-- ============ screen ============ -->
    <g clip-path="url(#clipScreen)" class="f">
      <!-- dynamic island -->
      <rect x="272" y="68" width="78" height="24" rx="12" fill="#12181F"/>
      <circle cx="341" cy="80" r="4" fill="#1E3A5F"/>

      <!-- store bar -->
      <g stroke="#252525" stroke-width="1.8" stroke-linecap="round">
        <path d="M152 112h16M152 118h16M152 124h16"/>
      </g>
      <text x="310" y="124" class="ink" font-size="17" letter-spacing="5" text-anchor="middle" style="font-weight:500">NORTHBOUND</text>
      <g stroke="#252525" stroke-width="1.8" fill="none">
        <path d="M456 112h18v18h-18z" rx="2"/>
        <path d="M461 112c0-5 8-5 8 0"/>
      </g>

      <!-- thank-you card -->
      <rect x="148" y="146" width="324" height="106" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <circle cx="180" cy="184" r="17" fill="none" stroke="#00A587" stroke-width="2.4"/>
      <path d="M172 184l6 6 10-12" stroke="#00A587" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="208" y="180" class="b ink" font-size="17">Thank you, Alex!</text>
      <text x="208" y="199" class="sb mut" font-size="12">Order #CP-78291</text>
      <text x="208" y="222" class="mut" font-size="11.5">We have your order and are getting it</text>
      <text x="208" y="237" class="mut" font-size="11.5">ready to ship.</text>

      <!-- edit header + countdown -->
      <text x="148" y="292" class="eb ink" font-size="21">Edit your order</text>
      <rect x="352" y="272" width="120" height="26" rx="13" fill="#EEF3FF"/>
      <circle cx="369" cy="285" r="7" fill="none" stroke="#155FFF" stroke-width="1.8"/>
      <path d="M369 281v4l3 2" stroke="#155FFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <text x="382" y="289" class="b blu" font-size="11">58 min left to edit</text>
      <text x="148" y="313" class="mut" font-size="12">Need a change? Make it yourself — no email, no wait.</text>

      <!-- action rows -->
      <g>
        <!-- add products -->
        <rect x="148" y="330" width="324" height="48" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
        <path d="M170 350h16v14h-16z" fill="none" stroke="#155FFF" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M174 350c0-5 8-5 8 0" fill="none" stroke="#155FFF" stroke-width="1.8"/>
        <text x="204" y="359" class="b ink" font-size="14">Add products</text>
        <path d="M448 349l7 7-7 7" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- shipping address -->
        <rect x="148" y="386" width="324" height="48" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
        <path d="M178 400c-7 0-12 5-12 12 0 9 12 18 12 18s12-9 12-18c0-7-5-12-12-12z" fill="none" stroke="#155FFF" stroke-width="1.8"/>
        <circle cx="178" cy="412" r="4" fill="#155FFF"/>
        <text x="204" y="415" class="b ink" font-size="14">Edit shipping address</text>
        <path d="M448 405l7 7-7 7" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- variant / quantity -->
        <rect x="148" y="442" width="324" height="48" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
        <path d="M168 462l10-6 10 6v12l-10 6-10-6z" fill="none" stroke="#155FFF" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M168 462l10 6 10-6M178 468v12" stroke="#155FFF" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="204" y="471" class="b ink" font-size="14">Change variant or quantity</text>
        <path d="M448 461l7 7-7 7" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- discounts -->
        <rect x="148" y="498" width="324" height="48" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
        <path d="M186 512l4 12-12 12-12-12 12-12z" fill="none" stroke="#155FFF" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="181" cy="519" r="2.4" fill="#155FFF"/>
        <text x="204" y="527" class="b ink" font-size="14">Apply a discount code</text>
        <path d="M448 517l7 7-7 7" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- cancel -->
        <rect x="148" y="554" width="324" height="48" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
        <circle cx="178" cy="578" r="11" fill="none" stroke="#155FFF" stroke-width="1.8"/>
        <path d="M174 574l8 8M182 574l-8 8" stroke="#155FFF" stroke-width="1.8" stroke-linecap="round"/>
        <text x="204" y="583" class="b ink" font-size="14">Cancel the order</text>
        <path d="M448 573l7 7-7 7" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- upsell -->
      <rect x="148" y="618" width="324" height="146" rx="12" fill="url(#upsell)" stroke="#D6E4FF" stroke-width="1.5"/>
      <rect x="160" y="630" width="122" height="122" rx="8" fill="url(#tote)"/>
      <g clip-path="url(#clipTote)">
        <path d="M182 676h78v58a8 8 0 0 1-8 8h-62a8 8 0 0 1-8-8z" fill="#E3DBCB"/>
        <path d="M198 676c0-18 4-28 12-28s12 10 12 28" fill="none" stroke="#C4B79E" stroke-width="4"/>
        <path d="M220 676c0-18 4-28 12-28s12 10 12 28" fill="none" stroke="#C4B79E" stroke-width="4"/>
        <rect x="204" y="700" width="34" height="11" rx="2" fill="#CFC5B1"/>
      </g>
      <rect x="166" y="636" width="56" height="21" rx="6" fill="#155FFF"/>
      <text x="194" y="651" class="b" font-size="11" fill="#ffffff" text-anchor="middle">15% OFF</text>

      <text x="296" y="654" class="b ink" font-size="15">Canvas Tote Bag</text>
      <text x="296" y="672" class="mut" font-size="11.5">Natural</text>
      <text x="296" y="694" class="mut" font-size="12.5" text-decoration="line-through">$79.00</text>
      <text x="344" y="694" class="eb blu" font-size="13.5">$67.15</text>
      <text x="296" y="713" class="mut" font-size="11">Add it to this order — one</text>
      <text x="296" y="726" class="mut" font-size="11">parcel, one delivery.</text>
      <rect x="296" y="734" width="164" height="30" rx="7" fill="#155FFF"/>
      <text x="378" y="754" class="b" font-size="13" fill="#ffffff" text-anchor="middle">Add to order</text>

      <!-- reassurance strip -->
      <path d="M156 782c0-4 4-6 8-8 4 2 8 4 8 8 0 6-4 10-8 12-4-2-8-6-8-12z" fill="none" stroke="#52525B" stroke-width="1.6"/>
      <text x="182" y="794" class="mut" font-size="11.5">Every change syncs to fulfilment instantly.</text>

      <!-- glass sheen over the whole screen -->
      <path d="M132 52h356v300L132 560z" fill="url(#glassSheen)" opacity=".5"/>
    </g>
  </g>
</svg>
