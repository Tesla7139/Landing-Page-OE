<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 980" width="620" height="980" fill="none" role="img" aria-labelledby="oePhoneTitle oePhoneDesc">
  <title id="oePhoneTitle">The order-editing screen a shopper sees</title>
  <desc id="oePhoneDesc">A phone showing the Gully Labs thank-you page: a countdown on how long the order stays editable, accordion rows for contact details, shipping address, order updates, discount codes and cancellation, then cross-sell products and a featured offer.</desc>

  <defs>
    <style>
      .f  { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .b  { font-weight: 700; }
      .sb { font-weight: 600; }
      .eb { font-weight: 800; }
      .ink { fill: #111827; }
      .mut { fill: #6A7282; }
      .grn { fill: #00A587; }
    </style>

    <filter id="pShadow" x="-40%" y="-25%" width="180%" height="155%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0A1628" flood-opacity="0.26"/>
    </filter>

    <!-- brushed-metal frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#8E9AA8"/>
      <stop offset="8%"   stop-color="#F2F5F9"/>
      <stop offset="20%"  stop-color="#5C6674"/>
      <stop offset="50%"  stop-color="#39424F"/>
      <stop offset="80%"  stop-color="#5C6674"/>
      <stop offset="93%"  stop-color="#EDF1F6"/>
      <stop offset="100%" stop-color="#7C8794"/>
    </linearGradient>
    <linearGradient id="bgSwirlA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6E4FF"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>

    <clipPath id="clipScreen"><rect x="132" y="52" width="356" height="856" rx="42"/></clipPath>
    <clipPath id="clipP1"><rect x="166" y="646" width="92" height="92" rx="6"/></clipPath>
    <clipPath id="clipP2"><rect x="270" y="646" width="92" height="92" rx="6"/></clipPath>
    <clipPath id="clipP3"><rect x="374" y="646" width="92" height="92" rx="6"/></clipPath>
    <clipPath id="clipHero"><rect x="166" y="872" width="76" height="60" rx="6"/></clipPath>
  </defs>

  <!-- ============ abstract backdrop ============ -->
  <g>
    <ellipse cx="556" cy="264" rx="220" ry="176" fill="url(#bgSwirlA)" transform="rotate(-26 556 264)"/>
    <ellipse cx="74" cy="756" rx="200" ry="150" fill="url(#bgSwirlA)" transform="rotate(16 74 756)"/>
    <g stroke="#B9D0FF" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M512 34c132 110 156 280 66 416s-98 262 24 384" stroke-width="18"/>
      <path d="M584 96c104 122 106 276 16 404s-68 236 48 336" stroke-width="14" opacity=".7"/>
      <path d="M62 264c-70 132-44 276 58 364s128 196 82 296" stroke-width="16" opacity=".55"/>
    </g>
    <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M552 62c120 112 136 272 54 400s-86 248 30 366" stroke-width="7"/>
      <path d="M34 308c-58 126-28 258 68 340" stroke-width="6" opacity=".8"/>
    </g>
  </g>

  <!-- ============ the phone ============ -->
  <g>
    <g filter="url(#pShadow)">
      <rect x="112" y="32" width="396" height="896" rx="62" fill="url(#frame)"/>
    </g>
    <rect x="122" y="42" width="376" height="876" rx="54" fill="#12181F"/>
    <rect x="132" y="52" width="356" height="856" rx="42" fill="#ffffff"/>

    <!-- side buttons -->
    <rect x="506" y="270" width="5" height="92" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="238" width="5" height="48" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="306" width="5" height="80" rx="2.5" fill="#6B7683"/>

    <!-- ============ screen ============ -->
    <g clip-path="url(#clipScreen)" class="f">
      <rect x="272" y="68" width="78" height="24" rx="12" fill="#12181F"/>

      <!-- store bar: mark + url pill -->
      <g fill="#111827">
        <path d="M154 128l7-22 7 6-7 22z"/>
        <path d="M168 128l7-22 7 6-7 22z"/>
      </g>
      <rect x="232" y="106" width="140" height="28" rx="14" fill="#F6F6F6" stroke="#E5E7EB" stroke-width="1.2"/>
      <text x="302" y="124" class="b ink" font-size="13" text-anchor="middle">gullylabs.com</text>

      <!-- confirmation -->
      <circle cx="168" cy="184" r="16" fill="none" stroke="#111827" stroke-width="1.8"/>
      <path d="M161 184l5 5 9-11" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="196" y="174" class="mut" font-size="11.5">Confirmation #JDTNH5Z6N</text>
      <text x="196" y="198" class="b ink" font-size="18">Thank you, Mohit!</text>

      <!-- ===== make changes panel ===== -->
      <rect x="148" y="220" width="324" height="386" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="252" class="b ink" font-size="15">Make changes to your order</text>

      <!-- countdown notice -->
      <rect x="166" y="264" width="288" height="62" rx="8" fill="#FEF8E4"/>
      <path d="M186 288l9 16h-18z" fill="none" stroke="#F0B429" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M186 294v4M186 301v.5" stroke="#F0B429" stroke-width="1.8" stroke-linecap="round"/>
      <text x="212" y="284" class="mut" font-size="11.5">You can make changes to order</text>
      <text x="212" y="300" class="mut" font-size="11.5">for another <tspan class="b" fill="#E0322E">59 minutes and</tspan></text>
      <text x="212" y="316" class="b" font-size="11.5" fill="#E0322E">46 seconds</text>

      <!-- accordion rows -->
      <g>
        <rect x="166" y="338" width="288" height="46" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <circle cx="190" cy="356" r="5.5" fill="none" stroke="#111827" stroke-width="1.6"/>
        <path d="M183 369c1.4-5.5 12.6-5.5 14 0" stroke="#111827" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <text x="212" y="366" class="b ink" font-size="12.5">Change Contact Information</text>
        <path d="M430 357l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="392" width="288" height="46" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M190 404c-6 0-10 4-10 10 0 6 10 14 10 14s10-8 10-14c0-6-4-10-10-10z" fill="none" stroke="#111827" stroke-width="1.6"/>
        <circle cx="190" cy="414" r="3" fill="#111827"/>
        <text x="212" y="420" class="b ink" font-size="12.5">Edit Shipping Address</text>
        <path d="M430 411l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="446" width="288" height="46" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M182 478l14-14 5 5-14 14h-5z" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
        <text x="212" y="474" class="b ink" font-size="12.5">Update your order</text>
        <path d="M430 465l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="500" width="288" height="46" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M198 512l4 11-11 11-11-11 11-11z" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="193" cy="519" r="2.2" fill="#111827"/>
        <text x="212" y="528" class="b ink" font-size="12.5">Apply Discount Code</text>
        <path d="M430 519l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="554" width="288" height="46" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M184 571l12 12M196 571l-12 12" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/>
        <text x="212" y="582" class="b ink" font-size="12.5">Cancel Your Order</text>
        <path d="M430 573l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- ===== cross-sell ===== -->
      <rect x="148" y="612" width="324" height="212" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="638" class="b ink" font-size="14">You may also like these products</text>

      <!-- card 1 — Kara Pleat Trouser, Navy -->
      <rect x="166" y="646" width="92" height="92" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP1)">
        <rect x="196" y="666" width="32" height="12" rx="3" fill="#E7E5E0"/>
        <path d="M196 676h32l4 62h-15l-5-40-5 40h-15z" fill="#232B3A"/>
      </g>
      <text x="166" y="752" class="ink" font-size="9">Kara - Pleat</text>
      <text x="166" y="763" class="ink" font-size="9">Trouser - Navy F...</text>
      <text x="166" y="778" class="mut" font-size="8.5" text-decoration="line-through">₹3,290</text>
      <text x="199" y="778" class="b grn" font-size="9.5">₹1,645</text>
      <rect x="166" y="786" width="92" height="24" rx="7" fill="#111827"/>
      <text x="212" y="802" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,645</text>

      <!-- card 2 — Kara Cross-collar Shirt, Brown -->
      <rect x="270" y="646" width="92" height="92" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP2)">
        <circle cx="316" cy="672" r="9" fill="#C9AE94"/>
        <path d="M298 686h36l6 52h-48z" fill="#A8927B"/>
        <path d="M310 686l6 8 6-8" fill="#8F7A64"/>
      </g>
      <text x="270" y="752" class="ink" font-size="9">Kara - Cross-collar</text>
      <text x="270" y="763" class="ink" font-size="9">Shirt - Brown For...</text>
      <text x="270" y="778" class="mut" font-size="8.5" text-decoration="line-through">₹3,425</text>
      <text x="303" y="778" class="b grn" font-size="9.5">₹1,713</text>
      <rect x="270" y="786" width="92" height="24" rx="7" fill="#111827"/>
      <text x="316" y="802" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,713</text>

      <!-- card 3 — Kara Pintuck Pant, Olive (runs off the edge, as it does live) -->
      <rect x="374" y="646" width="92" height="92" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP3)">
        <rect x="404" y="666" width="32" height="12" rx="3" fill="#E7E5E0"/>
        <path d="M404 676h32l4 62h-15l-5-40-5 40h-15z" fill="#6B7043"/>
      </g>
      <text x="374" y="752" class="ink" font-size="9">Kara - Pintuck</text>
      <text x="374" y="763" class="ink" font-size="9">Pant - Oliv...</text>
      <text x="374" y="778" class="mut" font-size="8.5" text-decoration="line-through">₹2,995</text>
      <text x="407" y="778" class="b grn" font-size="9.5">₹1,498</text>
      <rect x="374" y="786" width="92" height="24" rx="7" fill="#111827"/>
      <text x="420" y="802" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,498</text>
      <!-- scroll hint -->
      <rect x="166" y="816" width="60" height="3" rx="1.5" fill="#111827" opacity=".35"/>

      <!-- ===== featured offer, cut off by the fold like the real screen ===== -->
      <rect x="148" y="836" width="324" height="120" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="862" class="b ink" font-size="14">Too good to miss!</text>
      <rect x="166" y="872" width="76" height="60" rx="6" fill="#F1F1F1"/>
      <g clip-path="url(#clipHero)">
        <path d="M176 916h56a4 4 0 0 1 4 4v4h-64v-4a4 4 0 0 1 4-4z" fill="#ffffff" stroke="#DDDDDD" stroke-width="1"/>
        <path d="M180 916c-2-11 3-19 12-22l10-4c5-2 9 0 12 4l5 6c5 5 14 8 21 10 4 1 5 6 5 6z" fill="#E8E6E1"/>
        <path d="M196 898c4-6 9-9 15-11" stroke="#C9C7C1" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <rect x="170" y="876" width="44" height="15" rx="4" fill="#FDE8E8"/>
      <text x="192" y="887" class="b" font-size="8.5" fill="#E0322E" text-anchor="middle">50% OFF</text>
      <text x="254" y="884" class="b ink" font-size="12.5">Gully Number 001 –</text>
      <text x="254" y="900" class="b ink" font-size="12.5">Megh White For</text>
      <text x="254" y="916" class="b ink" font-size="12.5">Women</text>
      <text x="254" y="938" class="mut" font-size="10" text-decoration="line-through">₹3,990</text>
      <text x="292" y="938" class="b grn" font-size="12">₹1,995</text>
    </g>
  </g>
</svg>
