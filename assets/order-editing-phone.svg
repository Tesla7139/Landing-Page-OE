<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 900" width="620" height="900" fill="none" role="img" aria-labelledby="oePhoneTitle oePhoneDesc">
  <title id="oePhoneTitle">The order-editing screen a shopper sees</title>
  <desc id="oePhoneDesc">A phone showing the Gully Labs thank-you page: a countdown on how long the order stays editable, accordion rows for contact details, shipping address, order updates, discount codes and cancellation, then cross-sell products and a featured offer.</desc>

  <defs>
    <style>
      .f  { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .b  { font-weight: 700; }
      .sb { font-weight: 600; }
      .eb { font-weight: 800; }
      .ink { fill: #111827; }
      .mut { fill: #6A7282; }
      .grn { fill: #00A587; }
    </style>

    <filter id="pShadow" x="-40%" y="-25%" width="180%" height="155%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0A1628" flood-opacity="0.26"/>
    </filter>

    <!-- brushed-metal frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#8E9AA8"/>
      <stop offset="8%"   stop-color="#F2F5F9"/>
      <stop offset="20%"  stop-color="#5C6674"/>
      <stop offset="50%"  stop-color="#39424F"/>
      <stop offset="80%"  stop-color="#5C6674"/>
      <stop offset="93%"  stop-color="#EDF1F6"/>
      <stop offset="100%" stop-color="#7C8794"/>
    </linearGradient>
    <linearGradient id="bgSwirlA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6E4FF"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>

    <clipPath id="clipScreen"><rect x="132" y="52" width="356" height="796" rx="40"/></clipPath>
    <clipPath id="clipP1"><rect x="166" y="624" width="92" height="88" rx="6"/></clipPath>
    <clipPath id="clipP2"><rect x="270" y="624" width="92" height="88" rx="6"/></clipPath>
    <clipPath id="clipP3"><rect x="374" y="624" width="92" height="88" rx="6"/></clipPath>
    <clipPath id="clipHero"><rect x="166" y="838" width="76" height="56" rx="6"/></clipPath>
  </defs>

  <!-- ============ abstract backdrop ============ -->
  <g>
    <ellipse cx="556" cy="248" rx="216" ry="166" fill="url(#bgSwirlA)" transform="rotate(-26 556 248)"/>
    <ellipse cx="74" cy="700" rx="196" ry="142" fill="url(#bgSwirlA)" transform="rotate(16 74 700)"/>
    <g stroke="#B9D0FF" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M512 34c130 102 152 258 64 384s-96 242 22 354" stroke-width="18"/>
      <path d="M584 94c102 114 104 254 16 372s-66 218 46 310" stroke-width="14" opacity=".7"/>
      <path d="M62 250c-68 122-42 254 56 336s126 180 80 272" stroke-width="16" opacity=".55"/>
    </g>
    <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M552 60c118 104 134 252 52 370s-84 228 28 338" stroke-width="7"/>
      <path d="M34 292c-56 116-26 238 66 314" stroke-width="6" opacity=".8"/>
    </g>
  </g>

  <!-- ============ the phone ============ -->
  <g>
    <g filter="url(#pShadow)">
      <rect x="112" y="32" width="396" height="836" rx="58" fill="url(#frame)"/>
    </g>
    <rect x="122" y="42" width="376" height="816" rx="50" fill="#12181F"/>
    <rect x="132" y="52" width="356" height="796" rx="40" fill="#ffffff"/>

    <!-- side buttons -->
    <rect x="506" y="260" width="5" height="88" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="230" width="5" height="46" rx="2.5" fill="#6B7683"/>
    <rect x="109" y="296" width="5" height="76" rx="2.5" fill="#6B7683"/>

    <!-- ============ screen ============ -->
    <g clip-path="url(#clipScreen)" class="f">
      <rect x="272" y="66" width="78" height="24" rx="12" fill="#12181F"/>

      <!-- store bar: mark + url pill -->
      <g fill="#111827">
        <path d="M154 126l7-22 7 6-7 22z"/>
        <path d="M168 126l7-22 7 6-7 22z"/>
      </g>
      <rect x="232" y="104" width="140" height="28" rx="14" fill="#F6F6F6" stroke="#E5E7EB" stroke-width="1.2"/>
      <text x="302" y="122" class="b ink" font-size="13" text-anchor="middle">gullylabs.com</text>

      <!-- confirmation -->
      <circle cx="168" cy="180" r="15" fill="none" stroke="#111827" stroke-width="1.8"/>
      <path d="M161 180l5 5 9-11" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="196" y="171" class="mut" font-size="11.5">Confirmation #JDTNH5Z6N</text>
      <text x="196" y="194" class="b ink" font-size="18">Thank you, Mohit!</text>

      <!-- ===== make changes panel ===== -->
      <rect x="148" y="214" width="324" height="368" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="246" class="b ink" font-size="15">Make changes to your order</text>

      <!-- countdown notice -->
      <rect x="166" y="258" width="288" height="60" rx="8" fill="#FEF8E4"/>
      <path d="M186 282l9 16h-18z" fill="none" stroke="#F0B429" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M186 288v4M186 295v.5" stroke="#F0B429" stroke-width="1.8" stroke-linecap="round"/>
      <text x="212" y="278" class="mut" font-size="11.5">You can make changes to order</text>
      <text x="212" y="294" class="mut" font-size="11.5">for another <tspan class="b" fill="#E0322E">59 minutes and</tspan></text>
      <text x="212" y="310" class="b" font-size="11.5" fill="#E0322E">46 seconds</text>

      <!-- accordion rows -->
      <g>
        <rect x="166" y="330" width="288" height="42" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <circle cx="190" cy="345" r="5.2" fill="none" stroke="#111827" stroke-width="1.6"/>
        <path d="M183.5 357c1.3-5 12-5 13.3 0" stroke="#111827" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <text x="212" y="356" class="b ink" font-size="12.5">Change Contact Information</text>
        <path d="M430 347l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="378" width="288" height="42" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M190 388c-6 0-9.5 3.8-9.5 9.5 0 5.7 9.5 13.5 9.5 13.5s9.5-7.8 9.5-13.5c0-5.7-3.5-9.5-9.5-9.5z" fill="none" stroke="#111827" stroke-width="1.6"/>
        <circle cx="190" cy="397.5" r="2.9" fill="#111827"/>
        <text x="212" y="404" class="b ink" font-size="12.5">Edit Shipping Address</text>
        <path d="M430 395l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="426" width="288" height="42" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M182 458l14-14 5 5-14 14h-5z" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
        <text x="212" y="452" class="b ink" font-size="12.5">Update your order</text>
        <path d="M430 443l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="474" width="288" height="42" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M198 486l4 11-11 11-11-11 11-11z" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="193" cy="493" r="2.2" fill="#111827"/>
        <text x="212" y="500" class="b ink" font-size="12.5">Apply Discount Code</text>
        <path d="M430 491l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <rect x="166" y="522" width="288" height="42" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.4"/>
        <path d="M184 537l12 12M196 537l-12 12" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/>
        <text x="212" y="548" class="b ink" font-size="12.5">Cancel Your Order</text>
        <path d="M430 539l6 6 6-6" stroke="#6A7282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- ===== cross-sell ===== -->
      <rect x="148" y="590" width="324" height="206" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="616" class="b ink" font-size="14">You may also like these products</text>

      <!-- card 1 — Kara Pleat Trouser, Navy -->
      <rect x="166" y="624" width="92" height="88" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP1)">
        <rect x="196" y="642" width="32" height="12" rx="3" fill="#E7E5E0"/>
        <path d="M196 652h32l4 60h-15l-5-38-5 38h-15z" fill="#232B3A"/>
      </g>
      <text x="166" y="726" class="ink" font-size="9">Kara - Pleat</text>
      <text x="166" y="737" class="ink" font-size="9">Trouser - Navy F...</text>
      <text x="166" y="752" class="mut" font-size="8.5" text-decoration="line-through">₹3,290</text>
      <text x="199" y="752" class="b grn" font-size="9.5">₹1,645</text>
      <rect x="166" y="760" width="92" height="24" rx="7" fill="#111827"/>
      <text x="212" y="776" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,645</text>

      <!-- card 2 — Kara Cross-collar Shirt, Brown -->
      <rect x="270" y="624" width="92" height="88" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP2)">
        <circle cx="316" cy="650" r="9" fill="#C9AE94"/>
        <path d="M298 664h36l6 48h-48z" fill="#A8927B"/>
        <path d="M310 664l6 8 6-8" fill="#8F7A64"/>
      </g>
      <text x="270" y="726" class="ink" font-size="9">Kara - Cross-collar</text>
      <text x="270" y="737" class="ink" font-size="9">Shirt - Brown For...</text>
      <text x="270" y="752" class="mut" font-size="8.5" text-decoration="line-through">₹3,425</text>
      <text x="303" y="752" class="b grn" font-size="9.5">₹1,713</text>
      <rect x="270" y="760" width="92" height="24" rx="7" fill="#111827"/>
      <text x="316" y="776" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,713</text>

      <!-- card 3 — Kara Pintuck Pant, Olive (runs off the edge, as it does live) -->
      <rect x="374" y="624" width="92" height="88" rx="6" fill="url(#shelf)"/>
      <g clip-path="url(#clipP3)">
        <rect x="404" y="642" width="32" height="12" rx="3" fill="#E7E5E0"/>
        <path d="M404 652h32l4 60h-15l-5-38-5 38h-15z" fill="#6B7043"/>
      </g>
      <text x="374" y="726" class="ink" font-size="9">Kara - Pintuck</text>
      <text x="374" y="737" class="ink" font-size="9">Pant - Oliv...</text>
      <text x="374" y="752" class="mut" font-size="8.5" text-decoration="line-through">₹2,995</text>
      <text x="407" y="752" class="b grn" font-size="9.5">₹1,498</text>
      <rect x="374" y="760" width="92" height="24" rx="7" fill="#111827"/>
      <text x="420" y="776" class="b" font-size="9" fill="#ffffff" text-anchor="middle">Add · ₹1,498</text>
      <!-- scroll hint -->
      <rect x="166" y="790" width="60" height="3" rx="1.5" fill="#111827" opacity=".35"/>

      <!-- ===== featured offer, cut off by the fold like the real screen ===== -->
      <rect x="148" y="804" width="324" height="110" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="166" y="830" class="b ink" font-size="14">Too good to miss!</text>
      <rect x="166" y="838" width="76" height="56" rx="6" fill="#F1F1F1"/>
      <rect x="170" y="842" width="44" height="15" rx="4" fill="#FDE8E8"/>
      <text x="192" y="853" class="b" font-size="8.5" fill="#E0322E" text-anchor="middle">50% OFF</text>
      <text x="254" y="850" class="b ink" font-size="12.5">Gully Number 001 –</text>
      <text x="254" y="866" class="b ink" font-size="12.5">Megh White For Women</text>
    </g>
  </g>
</svg>
