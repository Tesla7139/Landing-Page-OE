<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" width="1240" height="930" fill="none" role="img" aria-labelledby="oeHeroTitle oeHeroDesc">
  <title id="oeHeroTitle">Self-serve order editing</title>
  <desc id="oeHeroDesc">A thank-you page with an open "make changes to your order" panel, surrounded by cards showing an incoming size-swap request, the remaining edit window, and a chart of edits made self-serve before fulfilment, with the same flow confirmed on a phone.</desc>

  <defs>
    <!-- Inter to match the landing page; degrades cleanly where it isn't installed -->
    <style>
      .f  { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .b  { font-weight: 700; }
      .sb { font-weight: 600; }
      .eb { font-weight: 800; }
      .ink { fill: #252525; }
      .mut { fill: #52525B; }
      .blu { fill: #155FFF; }
    </style>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#263238" flood-opacity="0.14"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#263238" flood-opacity="0.18"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#263238" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#263238" flood-opacity="0.12"/>
    </filter>

    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155FFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#155FFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FC"/>
      <stop offset="100%" stop-color="#E9EDF5"/>
    </linearGradient>
    <linearGradient id="feedImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF3FF"/>
      <stop offset="100%" stop-color="#D6E4FF"/>
    </linearGradient>

    <clipPath id="clipPhone"><rect x="792" y="150" width="336" height="700" rx="36"/></clipPath>
    <clipPath id="clipWin"><rect x="356" y="190" width="400" height="460" rx="14"/></clipPath>
    <clipPath id="clipTile"><rect x="118" y="92" width="268" height="182" rx="10"/></clipPath>
    <clipPath id="clipFeed"><rect x="820" y="500" width="280" height="200" rx="8"/></clipPath>
  </defs>

  <!-- ============ brand-blue backdrop panel ============ -->
  <path d="M290 168h430a52 52 0 0 1 52 52v520H238V220a52 52 0 0 1 52-52Z" fill="#D6E4FF"/>

  <!-- ============ centre: the order-editing surface itself ============ -->
  <g filter="url(#winShadow)">
    <rect x="356" y="190" width="400" height="460" rx="14" fill="#ffffff"/>
  </g>
  <g clip-path="url(#clipWin)" class="f">
    <!-- browser bezel -->
    <rect x="356" y="190" width="400" height="40" fill="#F6F6F6"/>
    <line x1="356" y1="230" x2="756" y2="230" stroke="#E5E7EB" stroke-width="1.5"/>
    <g fill="#D1D1D1">
      <circle cx="380" cy="210" r="5"/><circle cx="396" cy="210" r="5"/><circle cx="412" cy="210" r="5"/>
    </g>
    <rect x="470" y="199" width="176" height="22" rx="11" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.2"/>
    <text x="558" y="215" class="sb mut" font-size="12" text-anchor="middle">marsbyghc.com</text>

    <!-- confirmation header -->
    <circle cx="436" cy="273" r="15" fill="none" stroke="#00A587" stroke-width="2.2"/>
    <path d="M429 273l5 5 9-11" stroke="#00A587" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="464" y="266" class="sb mut" font-size="12">Confirmation #JDTNH5Z6N</text>
    <text x="464" y="290" class="eb ink" font-size="21">Thank you, Alex!</text>

    <!-- the edit panel -->
    <rect x="380" y="306" width="356" height="324" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="402" y="337" class="eb ink" font-size="16">Make changes to your order</text>

    <!-- countdown notice -->
    <rect x="402" y="352" width="312" height="50" rx="8" fill="#FFB400" fill-opacity=".12"/>
    <path d="M422 368l9 16h-18z" fill="none" stroke="#FFB400" stroke-width="2" stroke-linejoin="round"/>
    <path d="M431 373v4M431 380v.5" stroke="#FFB400" stroke-width="2" stroke-linecap="round" transform="translate(-9 0)"/>
    <text x="444" y="373" class="sb mut" font-size="12">You can change this order for another</text>
    <text x="444" y="391" class="b" font-size="12" fill="#D14343">57 minutes 28 seconds</text>

    <!-- accordion rows -->
    <g>
      <rect x="402" y="414" width="312" height="44" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <circle cx="428" cy="431" r="6" fill="none" stroke="#52525B" stroke-width="1.8"/>
      <path d="M420 445c1.5-6 14.5-6 16 0" stroke="#52525B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <text x="452" y="441" class="b ink" font-size="13.5">Change Contact Information</text>
      <path d="M684 433l6 6 6-6" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <rect x="402" y="466" width="312" height="44" rx="9" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
      <path d="M428 477c-6 0-10 4-10 10 0 7 10 15 10 15s10-8 10-15c0-6-4-10-10-10z" fill="none" stroke="#52525B" stroke-width="1.8"/>
      <circle cx="428" cy="487" r="3.2" fill="#52525B"/>
      <text x="452" y="493" class="b ink" font-size="13.5">Edit Shipping Address</text>
      <path d="M684 485l6 6 6-6" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- the open row -->
      <rect x="402" y="518" width="312" height="86" rx="9" fill="#EEF3FF" stroke="#155FFF" stroke-width="1.6"/>
      <path d="M421 545l12-12 6 6-12 12h-6z" fill="none" stroke="#155FFF" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="452" y="546" class="b blu" font-size="13.5">Update your order</text>
      <path d="M684 542l6-6 6 6" stroke="#155FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- variant + qty + save, inside the open row -->
      <rect x="420" y="560" width="42" height="28" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.4"/>
      <text x="441" y="579" class="sb mut" font-size="12" text-anchor="middle">M</text>
      <rect x="466" y="560" width="42" height="28" rx="6" fill="#155FFF"/>
      <text x="487" y="579" class="b" font-size="12" fill="#ffffff" text-anchor="middle">L</text>
      <rect x="516" y="560" width="80" height="28" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.4"/>
      <path d="M528 574h11" stroke="#52525B" stroke-width="2" stroke-linecap="round"/>
      <text x="556" y="579" class="sb mut" font-size="12" text-anchor="middle">2</text>
      <path d="M573 574h11M578.5 568.5v11" stroke="#52525B" stroke-width="2" stroke-linecap="round"/>
      <rect x="604" y="560" width="92" height="28" rx="6" fill="#155FFF"/>
      <text x="650" y="579" class="b" font-size="12" fill="#ffffff" text-anchor="middle">Save changes</text>
    </g>
  </g>

  <!-- ============ card A — an inbound edit request ============ -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="24" width="304" height="330" rx="16" fill="#ffffff"/>
  </g>
  <g class="f">
    <path d="M129 47l-8 8 8 8" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="142" y="61" class="b ink" font-size="19">Edit Request</text>
    <rect x="298" y="41" width="90" height="26" rx="13" fill="#00A587" fill-opacity=".12"/>
    <text x="343" y="59" class="eb" font-size="13" fill="#00A587" text-anchor="middle">Approved</text>

    <!-- product tile, drawn rather than photographed -->
    <rect x="118" y="92" width="268" height="182" rx="10" fill="url(#tileFill)"/>
    <g clip-path="url(#clipTile)">
      <!-- folded tee -->
      <path d="M206 126h80l17 19-15 12-4-5v54h-76v-54l-4 5-15-12z" fill="#155FFF" fill-opacity=".30"/>
      <path d="M206 126h80l-14 10c-8 6-18 6-26 0z" fill="#155FFF" fill-opacity=".50"/>
      <!-- the swapped size, circled -->
      <g filter="url(#softShadow)"><rect x="288" y="172" width="52" height="34" rx="8" fill="#ffffff"/></g>
      <text x="314" y="195" class="eb blu" font-size="15" text-anchor="middle">L</text>
      <circle cx="314" cy="189" r="28" stroke="#155FFF" stroke-width="2.6" fill="none" stroke-dasharray="152 24" transform="rotate(-28 314 189)"/>
    </g>
    <!-- status chip over the tile -->
    <g filter="url(#softShadow)"><rect x="130" y="226" width="156" height="32" rx="16" fill="#ffffff"/></g>
    <circle cx="150" cy="242" r="8" fill="none" stroke="#155FFF" stroke-width="2"/>
    <path d="M150 238v5M150 246.5v.5" stroke="#155FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="166" y="247" class="sb blu" font-size="13">Size swap M → L</text>

    <text x="252" y="298" class="mut" font-size="14" text-anchor="middle">Applied before pick &amp; pack</text>
    <line x1="118" y1="316" x2="386" y2="316" stroke="#F1F1F1" stroke-width="1.5"/>
    <text x="252" y="338" class="sb blu" font-size="14" text-anchor="middle">Synced to Warehouse — North</text>
  </g>

  <!-- ============ card B — the edit window ============ -->
  <g filter="url(#cardShadow)">
    <rect x="66" y="424" width="272" height="96" rx="16" fill="#ffffff"/>
  </g>
  <g class="f">
    <circle cx="112" cy="472" r="24" fill="#FFB400" fill-opacity=".16"/>
    <circle cx="112" cy="472" r="13" fill="none" stroke="#FFB400" stroke-width="2.4"/>
    <path d="M112 465v8l6 4" stroke="#FFB400" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <text x="148" y="466" class="b ink" font-size="17">Edit window</text>
    <text x="148" y="492" class="sb mut" font-size="15">58:12 left to change it</text>
  </g>

  <!-- ============ card C — self-serve edits chart ============ -->
  <g filter="url(#cardShadow)">
    <rect x="76" y="636" width="342" height="276" rx="16" fill="#ffffff"/>
  </g>
  <g class="f">
    <text x="104" y="674" class="sb mut" font-size="13" letter-spacing="1.6">BEFORE FULFILMENT</text>
    <text x="104" y="710" class="eb ink" font-size="25">Edits Made Self-Serve</text>

    <!-- scale: y=878 is 0%, y=754 is 100% -->
    <g class="mut" font-size="11">
      <text x="104" y="758">100%</text>
      <text x="108" y="789">75%</text>
      <text x="108" y="820">50%</text>
      <text x="112" y="882">0%</text>
    </g>
    <line x1="140" y1="754" x2="400" y2="754" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="140" y1="785" x2="400" y2="785" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="140" y1="878" x2="400" y2="878" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- bars; the pale full-height one is the column being hovered -->
    <g>
      <rect x="152" y="812" width="24" height="66" rx="5" fill="url(#barFill)"/>
      <rect x="196" y="760" width="24" height="118" rx="5" fill="#155FFF" fill-opacity=".16"/>
      <rect x="196" y="790" width="24" height="88" rx="5" fill="url(#barFill)"/>
      <rect x="240" y="822" width="24" height="56" rx="5" fill="url(#barFill)"/>
      <rect x="284" y="804" width="24" height="74" rx="5" fill="url(#barFill)"/>
      <rect x="328" y="768" width="24" height="110" rx="5" fill="url(#barFill)"/>
      <rect x="372" y="816" width="24" height="62" rx="5" fill="url(#barFill)"/>
    </g>
    <g class="mut sb" font-size="11" text-anchor="middle">
      <text x="164" y="898">ADDR</text>
      <text x="208" y="898">QTY</text>
      <text x="252" y="898">VAR</text>
      <text x="296" y="898">DISC</text>
      <text x="340" y="898">CNCL</text>
      <text x="384" y="898">GIFT</text>
    </g>
  </g>

  <!-- ============ the phone ============ -->
  <g filter="url(#phoneShadow)">
    <rect x="778" y="136" width="364" height="728" rx="46" fill="#2E3943"/>
  </g>
  <rect x="786" y="144" width="348" height="712" rx="40" fill="#1F2A33"/>
  <rect x="792" y="150" width="336" height="700" rx="36" fill="#ffffff"/>

  <g clip-path="url(#clipPhone)" class="f">
    <!-- status bar -->
    <text x="822" y="190" class="b ink" font-size="15">9:41</text>
    <rect x="928" y="168" width="64" height="26" rx="13" fill="#1F2A33"/>
    <circle cx="972" cy="181" r="5" fill="#155FFF" fill-opacity=".8"/>
    <g fill="#252525">
      <rect x="1022" y="181" width="3.5" height="6" rx="1.5"/>
      <rect x="1029" y="178" width="3.5" height="9" rx="1.5"/>
      <rect x="1036" y="175" width="3.5" height="12" rx="1.5"/>
      <rect x="1043" y="172" width="3.5" height="15" rx="1.5"/>
    </g>
    <g stroke="#252525" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M1058 178a12 12 0 0 1 16 0"/>
      <path d="M1062 182.5a7 7 0 0 1 8 0"/>
    </g>
    <circle cx="1066" cy="186.5" r="1.6" fill="#252525"/>
    <g>
      <rect x="1084" y="173" width="24" height="13" rx="3.5" fill="none" stroke="#252525" stroke-width="1.6"/>
      <rect x="1086" y="175" width="17" height="9" rx="2" fill="#252525"/>
      <rect x="1109.5" y="177" width="2.5" height="5" rx="1.2" fill="#252525"/>
    </g>

    <!-- screen header -->
    <path d="M824 226l-8 8 8 8" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="842" y="241" class="eb ink" font-size="19">Edit Your Order</text>

    <!-- checklist card -->
    <g filter="url(#softShadow)"><rect x="812" y="262" width="296" height="160" rx="14" fill="#ffffff"/></g>
    <rect x="812" y="262" width="296" height="160" rx="14" fill="none" stroke="#F1F1F1" stroke-width="1.5"/>
    <circle cx="838" cy="296" r="6" fill="#155FFF"/>
    <text x="856" y="302" class="eb ink" font-size="17">#JDTNH5Z6N</text>
    <rect x="1052" y="284" width="40" height="24" rx="12" fill="#EEF3FF"/>
    <text x="1072" y="301" class="b blu" font-size="12" text-anchor="middle">3/3</text>

    <g>
      <circle cx="838" cy="336" r="9" fill="#00A587"/>
      <path d="M834 336l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="856" y="341" class="sb ink" font-size="15">Shipping address updated</text>

      <circle cx="838" cy="368" r="9" fill="#00A587"/>
      <path d="M834 368l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="856" y="373" class="sb ink" font-size="15">Size swapped M → L</text>

      <circle cx="838" cy="400" r="9" fill="#00A587"/>
      <path d="M834 400l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="856" y="405" class="sb ink" font-size="15">Discount code applied</text>
    </g>

    <!-- confirmation section -->
    <path d="M824 452l-8 8 8 8" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="842" y="467" class="eb ink" font-size="19">Order Confirmed</text>

    <g filter="url(#softShadow)"><rect x="812" y="484" width="296" height="330" rx="14" fill="#ffffff"/></g>
    <rect x="812" y="484" width="296" height="330" rx="14" fill="none" stroke="#F1F1F1" stroke-width="1.5"/>

    <rect x="820" y="500" width="280" height="200" rx="8" fill="url(#feedImg)"/>
    <g clip-path="url(#clipFeed)">
      <rect x="820" y="662" width="280" height="38" fill="#155FFF" fill-opacity=".10"/>
      <!-- parcel: front, lid, tape, shipping label -->
      <rect x="916" y="590" width="88" height="72" rx="3" fill="#155FFF" fill-opacity=".28"/>
      <rect x="908" y="572" width="104" height="20" rx="3" fill="#155FFF" fill-opacity=".46"/>
      <rect x="956" y="590" width="8" height="72" fill="#ffffff" fill-opacity=".45"/>
      <rect x="928" y="612" width="34" height="26" rx="3" fill="#ffffff" fill-opacity=".85"/>
      <g stroke="#155FFF" stroke-width="2" stroke-linecap="round" opacity=".55">
        <path d="M934 620h20M934 626h14M934 632h20"/>
      </g>
      <g filter="url(#softShadow)"><rect x="838" y="518" width="106" height="30" rx="15" fill="#ffffff"/></g>
      <text x="891" y="538" class="sb blu" font-size="13" text-anchor="middle">Edited · size L</text>
    </g>

    <!-- reactions -->
    <g>
      <path d="M838 730c-11-9-15-16-10-22s13-4 16 1c3-5 11-7 16-1s1 13-10 22l-6 5z" fill="#FF4D6D" fill-opacity=".9"/>
      <text x="866" y="736" class="sb ink" font-size="14">On its way</text>
      <circle cx="972" cy="730" r="10" fill="none" stroke="#155FFF" stroke-width="2"/>
      <path d="M967 727h10M967 732h6" stroke="#155FFF" stroke-width="2" stroke-linecap="round"/>
      <text x="990" y="736" class="sb ink" font-size="14">0 tickets</text>
      <path d="M1080 722l4.5 9 10 1.5-7 7 1.5 10-9-4.5-9 4.5 1.5-10-7-7 10-1.5z" fill="#FFB400"/>
    </g>
    <text x="820" y="772" class="sb ink" font-size="14">No support ticket. No reship.</text>
    <text x="820" y="796" class="mut" font-size="14">Changed by the customer in 40 seconds.</text>
  </g>
</svg>
